<!DOCTYPE html>
<!-- Sjabloon voor assets/img/og-image.png (1200x630). Opnieuw renderen:
     node tools/render-og.js
     Gebruikt de zelf gehoste lettertypen en dezelfde kleurtokens als de site. -->
<html lang="nl"><head><meta charset="utf-8"><title>QuinnAI og-image</title>
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:200 800;src:url(../assets/fonts/bricolage-grotesque-latin-opsz-normal.woff2) format('woff2')}
@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;src:url(../assets/fonts/instrument-serif-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'Schibsted Grotesk';font-weight:400 900;src:url(../assets/fonts/schibsted-grotesk-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'Pixelify Sans';font-weight:500;src:url(../assets/fonts/pixelify-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(../assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
:root{--ink:#07070d;--paper:#f4f4f8;--muted:#a9a9bd;--lime:#c6ff3d;--cyan:#22e6ff;--pink:#ff2e93;--violet:#8b5cff;--on-lime:#0b0b12}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:'Schibsted Grotesk',sans-serif;position:relative;
  background-image:radial-gradient(760px 460px at 88% -6%,rgba(139,92,255,.42),transparent 62%),radial-gradient(620px 380px at -4% 108%,rgba(34,230,255,.20),transparent 62%),radial-gradient(700px 300px at 50% 118%,rgba(255,46,147,.25),transparent 62%)}
body::after{content:"";position:absolute;inset:0;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
.c{position:absolute;inset:64px 72px;display:flex;flex-direction:column;z-index:1}
.brand{display:flex;align-items:center;gap:16px;font:800 36px 'Bricolage Grotesque',serif;letter-spacing:-.03em}
.mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(150deg,var(--lime),var(--cyan));display:grid;place-items:center;color:var(--on-lime);font-size:32px;box-shadow:5px 5px 0 var(--pink)}
h1{font:800 94px/1 'Bricolage Grotesque',serif;letter-spacing:-.035em;margin-top:40px}
h1 em{font:italic 400 1.07em 'Instrument Serif',serif;color:var(--lime);letter-spacing:-.02em}
h1 s{text-decoration-thickness:6px;text-decoration-color:var(--pink);opacity:.45}
p{font-size:32px;line-height:1.35;color:var(--muted);margin-top:22px;max-width:860px}
.foot{margin-top:auto;display:flex;align-items:center;gap:20px}
.url{font:500 28px 'IBM Plex Mono',monospace;color:var(--lime)}
.pill{font:500 20px 'Pixelify Sans',monospace;color:var(--on-lime);background:var(--lime);border:2px solid var(--on-lime);border-radius:6px;padding:8px 16px;letter-spacing:.08em;text-transform:uppercase;box-shadow:4px 4px 0 var(--pink);transform:rotate(-3deg)}
</style></head><body>
<div class="c">
  <div class="brand"><span class="mark">Q</span>QuinnAI</div>
  <h1>Quinn antwoordt <s>nooit</s><br>nu binnen <em>0,4 seconden.</em></h1>
  <p>Een nep-AI die nergens verstand van heeft,<br>maar overal op reageert.</p>
  <div class="foot"><span class="url">quinnai.tech</span><span class="pill">100% lokaal</span></div>
</div>
</body></html>
