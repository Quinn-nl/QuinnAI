name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax engine.js en test.js
        run: |
          node --check assets/js/engine.js
          node --check assets/js/ui.js
          node --check tools/test.js
      - name: Repo-controles (inline scripts, lokale bestanden, engine-versie)
        run: node tools/check.js
      - name: Testsuite
        run: node tools/test.js